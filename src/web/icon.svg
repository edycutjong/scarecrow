<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#450a0a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <radialGradient id="lensGlass" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7f1d1d" stop-opacity="0.1"/>
    </radialGradient>
    <filter id="neon" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="24" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <pattern id="scanline" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000000" fill-opacity="0.4"/>
    </pattern>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  
  <!-- Outer Mechanical Ring -->
  <circle cx="256" cy="256" r="160" fill="#0f172a" stroke="#1e293b" stroke-width="24"/>
  
  <!-- Target Lock Brackets (AI Multimodal Understanding) -->
  <g stroke="#f59e0b" stroke-width="12" fill="none" stroke-linecap="square" stroke-linejoin="miter" filter="url(#neon)">
    <!-- Top Left -->
    <path d="M 80 140 L 80 80 L 140 80"/>
    <!-- Top Right -->
    <path d="M 372 80 L 432 80 L 432 140"/>
    <!-- Bottom Left -->
    <path d="M 80 372 L 80 432 L 140 432"/>
    <!-- Bottom Right -->
    <path d="M 372 432 L 432 432 L 432 372"/>
  </g>

  <!-- Lens Glass -->
  <circle cx="256" cy="256" r="130" fill="url(#lensGlass)"/>
  <circle cx="256" cy="256" r="130" fill="url(#scanline)"/>
  
  <!-- Inner Lens Rings -->
  <circle cx="256" cy="256" r="80" fill="none" stroke="#ef4444" stroke-width="8" opacity="0.6"/>
  <circle cx="256" cy="256" r="40" fill="#ef4444" filter="url(#neon)"/>
  <circle cx="256" cy="256" r="12" fill="#111111"/>
  
  <!-- Optic Glare -->
  <path d="M 160 200 A 90 90 0 0 1 230 140" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" opacity="0.4"/>
  
  <!-- Scanning Laser Line -->
  <path d="M 100 256 L 412 256" fill="none" stroke="#ef4444" stroke-width="4" filter="url(#neon)"/>
  <path d="M 256 100 L 256 412" fill="none" stroke="#ef4444" stroke-width="2" filter="url(#neon)" opacity="0.4"/>

  <!-- Processing Data Bar -->
  <rect x="176" y="440" width="160" height="12" rx="6" fill="#1e293b"/>
  <rect x="176" y="440" width="100" height="12" rx="6" fill="#ef4444" filter="url(#neon)"/>
  <rect x="176" y="440" width="100" height="12" rx="6" fill="#ffffff" opacity="0.6"/>
</svg>