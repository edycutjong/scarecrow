<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;family=JetBrains+Mono:wght@400;600;800&amp;family=Orbitron:wght@600;800&amp;display=swap');

      /* --- Animations --- */
      @keyframes streamFlow {
        to { stroke-dashoffset: -24; }
      }
      @keyframes pulseNode {
        0%, 100% { opacity: 0.8; }
        50% { opacity: 1; filter: brightness(1.2); }
      }
      @keyframes pulseAlert {
        0%, 100% { opacity: 0.8; }
        50% { opacity: 1; filter: brightness(1.4); transform: scale(1.02); }
      }

      .data-stream {
        stroke-dasharray: 4 8;
        animation: streamFlow 1s linear infinite;
      }
      .data-stream-fast {
        stroke-dasharray: 4 8;
        animation: streamFlow 0.6s linear infinite;
      }
      .node {
        animation: pulseNode 3s ease-in-out infinite;
      }
      .node-alert {
        transform-origin: 485px 242px;
        animation: pulseAlert 1.5s ease-in-out infinite;
      }
    </style>

    <!-- Background Gradients (stop-opacity, not rgba(): librsvg/SVG-spec compliant) -->
    <radialGradient id="bgGlowCyan" cx="1024" cy="-64" r="760" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.20"/>
      <stop offset="60%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgGlowPurple" cx="128" cy="704" r="700" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.20"/>
      <stop offset="60%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M 44 0 L 0 0 0 44" fill="none" stroke="rgba(27, 39, 64, 0.45)" stroke-width="1" />
    </pattern>

    <!-- Grid Mask -->
    <radialGradient id="gridMask" cx="50%" cy="30%" r="80%">
      <stop offset="30%" stop-color="#fff" stop-opacity="1" />
      <stop offset="90%" stop-color="#fff" stop-opacity="0" />
    </radialGradient>
    <mask id="mask-grid">
      <rect width="1280" height="640" fill="url(#gridMask)" />
    </mask>

    <!-- Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- SVG Filters from original right side -->
    <filter id="glowRed" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowCyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowAmber" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowGreen" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowPurple" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowBlue" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1280" height="640" fill="#060912" />
  <rect width="1280" height="640" fill="url(#bgGlowCyan)" />
  <rect width="1280" height="640" fill="url(#bgGlowPurple)" />

  <!-- Animated Grid Overlay -->
  <rect width="1280" height="640" fill="url(#grid)" mask="url(#mask-grid)" />

  <!-- LEFT SIDE TEXT & INFO -->
  <g transform="translate(48, 120)">
    <!-- Shadow for Title -->
    <text x="0" y="80" font-family="'Orbitron', sans-serif" font-size="66" font-weight="600" fill="rgba(239,68,68,0.2)" filter="url(#glowRed)">Scarecrow</text>
    <!-- Actual Title -->
    <text x="0" y="80" font-family="'Orbitron', sans-serif" font-size="66" font-weight="600" fill="url(#titleGrad)">Scarecrow</text>
    
    <!-- Subtitle (two lines so it never collides with the right-side diagram) -->
    <text x="0" y="128" font-family="'Inter', sans-serif" font-size="22" fill="#94a3b8">$50 off-grid AI sentry on a Raspberry Pi.</text>
    <text x="0" y="158" font-family="'Inter', sans-serif" font-size="22" fill="#94a3b8">See, understand, speak &#8212; zero cloud.</text>

    <!-- Features -->
    <g transform="translate(0, 190)" font-family="'JetBrains Mono', monospace" font-size="14" fill="#cbd5e1">
      <g transform="translate(0, 0)">
        <text x="0" y="0" fill="#06b6d4" font-weight="bold" filter="url(#glowCyan)">→</text>
        <text x="25" y="0">Multimodal scene understanding</text>
      </g>
      <g transform="translate(0, 32)">
        <text x="0" y="0" fill="#06b6d4" font-weight="bold" filter="url(#glowCyan)">→</text>
        <text x="25" y="0">Natural-language rule engine</text>
      </g>
      <g transform="translate(0, 64)">
        <text x="0" y="0" fill="#06b6d4" font-weight="bold" filter="url(#glowCyan)">→</text>
        <text x="25" y="0">RAG-based known entity memory</text>
      </g>
      <g transform="translate(0, 96)">
        <text x="0" y="0" fill="#06b6d4" font-weight="bold" filter="url(#glowCyan)">→</text>
        <text x="25" y="0">Spoken TTS alerts on match</text>
      </g>
      <g transform="translate(0, 128)">
        <text x="0" y="0" fill="#06b6d4" font-weight="bold" filter="url(#glowCyan)">→</text>
        <text x="25" y="0">≤4GB RAM · Solar/battery</text>
      </g>
    </g>

    <!-- Tech Pills -->
    <g transform="translate(0, 380)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="165" height="30" rx="6" fill="rgba(239,68,68,0.1)" stroke="rgba(239,68,68,0.3)" />
        <text x="82.5" y="19" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" fill="#ef4444" text-anchor="middle">RASPBERRY PI 4/5</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(175, 0)">
        <rect x="0" y="0" width="105" height="30" rx="6" fill="rgba(6,182,212,0.1)" stroke="rgba(6,182,212,0.3)" />
        <text x="52.5" y="19" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" fill="#06b6d4" text-anchor="middle">QVAC VISION</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(290, 0)">
        <rect x="0" y="0" width="115" height="30" rx="6" fill="rgba(168,85,247,0.1)" stroke="rgba(168,85,247,0.3)" />
        <text x="57.5" y="19" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" fill="#a855f7" text-anchor="middle">LLAMA 3.2 1B</text>
      </g>
    </g>
  </g>

  <!-- RIGHT SIDE DIAGRAM -->
  <svg x="512" y="0" width="768" height="640" viewBox="0 0 768 640">
        <!-- Camera -->
        <g class="node" style="animation-delay: 0s;">
          <rect x="60" y="240" width="100" height="70" rx="12" fill="rgba(239,68,68,0.06)" stroke="#ef4444" stroke-width="1.5" filter="url(#glowRed)" />
          <circle cx="110" cy="268" r="14" fill="none" stroke="#ef4444" stroke-width="2" opacity="0.5" />
          <circle cx="110" cy="268" r="5" fill="#ef4444" opacity="0.6" />
          <text x="110" y="330" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#ef4444" text-anchor="middle">Camera</text>
        </g>

        <!-- Vision -->
        <g class="node" style="animation-delay: 0.5s;">
          <rect x="230" y="240" width="120" height="50" rx="12" fill="rgba(245,158,11,0.06)" stroke="#f59e0b" stroke-width="1.5" filter="url(#glowAmber)" />
          <text x="290" y="270" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#f59e0b" text-anchor="middle">Vision-1B</text>
        </g>

        <!-- Rules Engine -->
        <g class="node" style="animation-delay: 1.0s;">
          <rect x="230" y="340" width="120" height="50" rx="12" fill="rgba(6,182,212,0.06)" stroke="#06b6d4" stroke-width="1.5" filter="url(#glowCyan)" />
          <text x="290" y="370" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#06b6d4" text-anchor="middle">Rules Engine</text>
        </g>

        <!-- Alert -->
        <g class="node-alert" style="animation-delay: 1.5s;">
          <rect x="430" y="220" width="110" height="45" rx="12" fill="rgba(239,68,68,0.06)" stroke="#ef4444" stroke-width="1.5" filter="url(#glowRed)" />
          <text x="485" y="247" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#ef4444" text-anchor="middle">🔊 Alert (TTS)</text>
        </g>

        <!-- Ignore -->
        <g class="node">
          <rect x="430" y="310" width="110" height="40" rx="12" fill="rgba(34,197,94,0.06)" stroke="#22c55e" stroke-width="1.5" filter="url(#glowGreen)" />
          <text x="485" y="335" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#22c55e" text-anchor="middle">✓ Ignore</text>
        </g>

        <!-- Log -->
        <g class="node">
          <rect x="430" y="380" width="110" height="40" rx="12" fill="rgba(168,85,247,0.06)" stroke="#a855f7" stroke-width="1.5" filter="url(#glowPurple)" />
          <text x="485" y="405" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#a855f7" text-anchor="middle">📋 Event Log</text>
        </g>

        <!-- Sleep -->
        <g class="node">
          <rect x="620" y="290" width="100" height="50" rx="12" fill="rgba(59,130,246,0.06)" stroke="#3b82f6" stroke-width="1.5" filter="url(#glowBlue)" />
          <text x="670" y="320" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#3b82f6" text-anchor="middle">💤 Sleep</text>
        </g>

        <!-- Connections (Base lines + Animated Overlays) -->
        <!-- Cam -> Vision -->
        <path d="M 160 265 L 230 265" fill="none" stroke="rgba(245,158,11,0.2)" stroke-width="2" />
        <path class="data-stream" d="M 160 265 L 230 265" fill="none" stroke="#f59e0b" stroke-width="2" />

        <!-- Vision -> Rules -->
        <path d="M 290 290 L 290 340" fill="none" stroke="rgba(6,182,212,0.2)" stroke-width="2" />
        <path class="data-stream" d="M 290 290 L 290 340" fill="none" stroke="#06b6d4" stroke-width="2" />

        <!-- Rules -> Alert -->
        <path d="M 350 355 L 430 242" fill="none" stroke="rgba(239,68,68,0.2)" stroke-width="2" />
        <path class="data-stream-fast" d="M 350 355 L 430 242" fill="none" stroke="#ef4444" stroke-width="3" filter="url(#glowRed)" />

        <!-- Rules -> Ignore -->
        <path d="M 350 365 L 430 330" fill="none" stroke="rgba(34,197,94,0.2)" stroke-width="2" />
        <path class="data-stream" d="M 350 365 L 430 330" fill="none" stroke="#22c55e" stroke-width="2" filter="url(#glowGreen)" />

        <!-- Rules -> Log -->
        <path d="M 350 375 L 430 400" fill="none" stroke="rgba(168,85,247,0.2)" stroke-width="2" />
        <path class="data-stream" d="M 350 375 L 430 400" fill="none" stroke="#a855f7" stroke-width="2" filter="url(#glowPurple)" />

        <!-- Alert -> Sleep -->
        <path d="M 540 242 L 620 315" fill="none" stroke="rgba(59,130,246,0.2)" stroke-width="2" />
        <path class="data-stream" d="M 540 242 L 620 315" fill="none" stroke="#3b82f6" stroke-width="2" filter="url(#glowBlue)" />

        <!-- Ignore -> Sleep -->
        <path d="M 540 330 L 620 315" fill="none" stroke="rgba(59,130,246,0.2)" stroke-width="2" />
        <path class="data-stream" d="M 540 330 L 620 315" fill="none" stroke="#3b82f6" stroke-width="2" filter="url(#glowBlue)" />

        <!-- Log -> Sleep -->
        <path d="M 540 400 L 620 315" fill="none" stroke="rgba(59,130,246,0.2)" stroke-width="2" />
        <path class="data-stream" d="M 540 400 L 620 315" fill="none" stroke="#3b82f6" stroke-width="2" filter="url(#glowBlue)" />

        <!-- Loop back arrow -->
        <path d="M 670 340 Q 670 490 110 380 Q 60 365 60 310" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" stroke-dasharray="4 6" />
        <path class="data-stream" d="M 670 340 Q 670 490 110 380 Q 60 365 60 310" fill="none" stroke="#64748b" stroke-width="1.5" />
        <text x="360" y="475" font-family="'JetBrains Mono', monospace" font-size="11" fill="#64748b" text-anchor="middle">← Wait for next interval or PIR</text>

        <!-- Rule example -->
        <rect x="60" y="500" width="360" height="44" rx="8" fill="rgba(6,182,212,0.05)" stroke="rgba(6,182,212,0.2)" stroke-width="1" />
        <text x="80" y="526" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#06b6d4">"alert if person near shed; ignore dogs"</text>

        <!-- Badges -->
        <rect x="60" y="560" width="85" height="26" rx="13" fill="rgba(239,68,68,0.08)" stroke="rgba(239,68,68,0.2)" stroke-width="1" />
        <text x="102" y="577" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800" fill="#ef4444" text-anchor="middle">≤4GB</text>

        <rect x="160" y="560" width="85" height="26" rx="13" fill="rgba(245,158,11,0.08)" stroke="rgba(245,158,11,0.2)" stroke-width="1" />
        <text x="202" y="577" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800" fill="#f59e0b" text-anchor="middle">Solar</text>

        <rect x="260" y="560" width="105" height="26" rx="13" fill="rgba(34,197,94,0.08)" stroke="rgba(34,197,94,0.2)" stroke-width="1" />
        <text x="312" y="577" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800" fill="#22c55e" text-anchor="middle">Air-Gapped</text>

        <rect x="380" y="560" width="95" height="26" rx="13" fill="rgba(168,85,247,0.08)" stroke="rgba(168,85,247,0.2)" stroke-width="1" />
        <text x="427" y="577" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800" fill="#a855f7" text-anchor="middle">RAG Memory</text>
  </svg>
</svg>
